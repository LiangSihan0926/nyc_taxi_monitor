[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taxi_monitor"
version = "0.1.0"
description = "Scalable NYC Taxi Demand Monitoring System with streaming hotspot detection and approximate counting."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "LiangSihan0926" }]
license = { text = "MIT" }
dependencies = [
    "duckdb>=0.10.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "coverage>=7.4",
]
viz = [
    "matplotlib>=3.7",
    "streamlit>=1.28.0",
]

[project.scripts]
taxi-download     = "scripts.download_data:main"
taxi-pipeline     = "scripts.run_pipeline:main"
taxi-experiment-1 = "scripts.experiment_1_batch_hotspot:main"
taxi-experiment-2 = "scripts.experiment_2_anomaly:main"
taxi-experiment-3 = "scripts.experiment_3_streaming_vs_batch:main"
taxi-experiment-4 = "scripts.experiment_4_exact_vs_approximate:main"
taxi-experiment-5 = "scripts.experiment_5_parallel:main"
taxi-figures      = "scripts.make_figures:main"
taxi-experiment-6-forecast = "scripts.experiment_6_forecast:main"
taxi-experiment-7-advanced-anomaly = "scripts.experiment_7_advanced_anomaly:main"
taxi-experiment-8-business-analytics = "scripts.experiment_8_business_analytics:main"
taxi-dashboard = "scripts.run_dashboard:main"
taxi-benchmark = "scripts.run_benchmark:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["taxi_monitor*", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"

[tool.coverage.run]
branch = true
source = ["taxi_monitor"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
